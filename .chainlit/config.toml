[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = false
allow_origins = ["http://localhost:*", "http://127.0.0.1:*"]

[features]
unsafe_allow_html = true
latex = false
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false
favorites = false

[features.slack]
reaction_on_message_received = false

[features.spontaneous_file_upload]
enabled = true
accept = [".pdf", ".docx", ".doc", ".txt"]
max_files = 5
max_size_mb = 10

[features.audio]
enabled = false
sample_rate = 24000

[features.mcp]
enabled = false

[features.mcp.sse]
enabled = true

[features.mcp.streamable-http]
enabled = true

[features.mcp.stdio]
enabled = true
allowed_executables = ["npx", "uvx"]

[UI]
name = "私人专属面试顾问 V1.0"
description = "Private Interview Coach"
default_theme = "dark"
confirm_new_chat = true
cot = "full"
alert_style = "classic"
custom_css = "/public/custom.css"

[meta]
generated_by = "2.11.1"
