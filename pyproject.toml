[project]
name = "interview-coach"
version = "0.2.0"
description = "基于LangGraph+LangChain的AI面试教练Agent"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-classic>=0.1.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=1.0.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "faiss-cpu>=1.8.0",
    "rank_bm25>=0.2.2",
    "jieba>=0.42.1",
    "dashscope>=1.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "chainlit>=1.0.0",
    "pypdf>=4.2.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "api*", "core*", "domain*", "infrastructure*", "prompts*", "scripts*"]
