default_jd: |
  岗位名称：电商运营
  岗位职责：
  1. 负责店铺整体运营规划，制定并执行销售策略，完成GMV目标
  2. 负责直通车、引力魔方等付费推广工具的投放与优化，提升ROI
  3. 策划并执行大促活动（618、双11等），制定活动方案及节奏
  4. 分析店铺数据（流量、转化、客单价等），输出运营复盘报告
  5. 跟进选品与供应链协调，优化库存周转与动销率
  任职要求：
  1. 1年以上电商运营经验，有淘宝/天猫/京东/拼多多操盘经验
  2. 熟悉各电商平台规则与算法机制
  3. 具备数据分析能力，能独立完成运营复盘
  4. 有大促活动策划经验优先

